name: Build Android APK (Swasthya Wallet)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build

      - name: Initialize Capacitor Android project & sync assets
        run: |
          npm install --no-save @capacitor/core@^7.0.0 @capacitor/cli@^7.0.0 @capacitor/android@^7.0.0
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          cp public/assets/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
          cp public/assets/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png || true

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Swasthya Wallet APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swasthya-wallet-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
