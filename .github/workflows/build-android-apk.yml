
name: Build Android APK (Swasthya Wallet)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Swasthya Wallet APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      # 4. Install project dependencies
      # Avoid npm ci because the repository uses bun.lock
      # and may not contain package-lock.json.
      - name: Install dependencies
        run: |
          npm install --no-package-lock

      # 5. Install Capacitor Android dependencies
      - name: Install Capacitor
        run: |
          npm install --no-save --no-package-lock \
            @capacitor/core@^7 \
            @capacitor/cli@^7 \
            @capacitor/android@^7

      # 6. Build React/Vite application
      - name: Build web application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          npm run build

      # 7. Initialize Capacitor configuration if missing
      - name: Configure Capacitor
        run: |
          if [ ! -f "capacitor.config.ts" ] && \
             [ ! -f "capacitor.config.json" ] && \
             [ ! -f "capacitor.config.js" ]; then
            npx cap init "Swasthya Wallet" \
              "com.aashishdev22.swasthyawallet" \
              --web-dir=dist
          fi

      # 8. Add Android platform if missing
      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # 9. Sync web assets with Android
      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      # 10. Build Android Debug APK
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 11. Verify APK
      - name: Verify APK
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK file was not generated!"
            exit 1
          fi

          echo "APK successfully generated!"
          ls -lh "$APK_PATH"

      # 12. Upload APK artifact
      - name: Upload Swasthya Wallet APK
        uses: actions/upload-artifact@v4
        with:
          name: swasthya-wallet-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
